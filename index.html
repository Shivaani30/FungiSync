      function allocationIssues(p){const issues=[],batchTotals=new Map(),orderTotals=new Map();if(!p?.rows?.length)return ['Proposal contains no allocation lines.'];for(const r of p.rows){const b=data.batches.find(x=>x.id===r.batch),o=data.orders.find(x=>x.id===r.order),q=Number(r.qty);if(!Number.isFinite(q)||q<=0)issues.push(`${r.batch} → ${r.order}: quantity must be greater than zero.`);if(!b||!o){issues.push(`${r.batch} → ${r.order}: batch or order no longer exists.`);continue}if(['Cancelled','Completed'].includes(o.status))issues.push(`${o.id}: order is ${o.status.toLowerCase()}.`);if(b.status!=='Saleable'||b.grade==='Rejected'||data.growers.find(g=>g.id===b.grower)?.status==='Inactive')issues.push(`${b.id}: batch or grower is not eligible.`);if(b.species!==o.species)issues.push(`${b.id} / ${o.id}: species do not match.`);if(o.quality!=='Any'&&o.quality!==b.grade)issues.push(`${b.id} / ${o.id}: requested quality is not met.`);if(b.date>o.date)issues.push(`${b.id} / ${o.id}: harvest date is after delivery.`);batchTotals.set(b.id,(batchTotals.get(b.id)||0)+q);orderTotals.set(o.id,(orderTotals.get(o.id)||0)+q)}for(const [id,q] of batchTotals){const b=data.batches.find(x=>x.id===id);if(b&&q>b.saleable)issues.push(`${id}: proposed quantity exceeds saleable quantity.`)}for(const [id,q] of orderTotals){const o=data.orders.find(x=>x.id===id);if(o&&q>o.qty)issues.push(`${id}: proposed quantity exceeds requested quantity.`)}return [...new Set(issues)]}
      function allocateRows(reserved=[]){const rows=[],batchLeft=new Map(data.batches.map(b=>[b.id,Number(b.saleable)||0])),orderLeft=new Map(activeOrders().map(o=>[o.id,Number(o.qty)||0]));for(const r of reserved){batchLeft.set(r.batch,Math.max(0,(batchLeft.get(r.batch)||0)-Number(r.qty||0)));if(orderLeft.has(r.order))orderLeft.set(r.order,Math.max(0,orderLeft.get(r.order)-Number(r.qty||0)))}const orders=activeOrders().filter(o=>data.buyers.find(b=>b.id===o.buyer)?.status!=='Inactive').slice().sort((a,b)=>(b.priority==='High')-(a.priority==='High')||a.date.localeCompare(b.date));for(const o of orders){let need=orderLeft.get(o.id)||0;const batches=data.batches.filter(b=>b.status==='Saleable'&&b.grade!=='Rejected'&&b.species===o.species&&b.date<=o.date&&data.growers.find(g=>g.id===b.grower)?.status!=='Inactive'&&(o.quality==='Any'||o.quality===b.grade)).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));for(const b of batches){const qty=Math.min(need,batchLeft.get(b.id)||0);if(qty>0){rows.push({batch:b.id,order:o.id,qty});batchLeft.set(b.id,batchLeft.get(b.id)-qty);need-=qty}if(!need)break}}return rows}

        if(!window.Chart){

          const bar=canvas('supply-chart');if(bar){const {ctx,w,h}=bar,vals=[available(),demand()],max=Math.max(1,...vals);ctx.clearRect(0,0,w,h);ctx.fillStyle='#68776F';ctx.font='11px sans-serif';for(let i=0;i<4;i++){const y=20+i*43;ctx.strokeStyle='#E1E8E2';ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(w-8,y);ctx.stroke()}const base=h-30,scale=(h-60)/max;vals.forEach((v,i)=>{const x=w*.34+i*w*.29,bh=v*scale;ctx.fillStyle=i?'#d7aa65':'#145A48';ctx.beginPath();ctx.roundRect(x,base-bh,w*.18,bh,5);ctx.fill();ctx.fillStyle='#1C2B25';ctx.textAlign='center';ctx.fillText(v+' kg',x+w*.09,base-bh-7);ctx.fillText(i?'Active demand':'Saleable',x+w*.09,h-8)})}
          const donut=canvas('fulfil-chart');if(donut){const {ctx,w,h}=donut,total=Math.max(1,demand()),parts=[allocated(),unmet()],colors=['#145A48','#d8e4db'];let angle=-Math.PI/2;ctx.clearRect(0,0,w,h);parts.forEach((v,i)=>{const next=angle+Math.PI*2*v/total;ctx.beginPath();ctx.strokeStyle=colors[i];ctx.lineWidth=22;ctx.arc(w/2,h/2,54,angle,next);ctx.stroke();angle=next});ctx.fillStyle='#1C2B25';ctx.textAlign='center';ctx.font='700 16px sans-serif';ctx.fillText(allocated()+' kg',w/2,h/2+5);ctx.font='11px sans-serif';ctx.fillStyle='#68776F';ctx.fillText('allocated',w/2,h/2+23)}
          const harvest=canvas('harvest-chart');if(harvest){const {ctx,w,h}=harvest,days=[...new Set(data.batches.map(b=>b.date))].sort(),max=Math.max(1,...days.map(day=>sum(data.batches.filter(b=>b.date===day),'saleable'))),slot=(w-40)/Math.max(1,days.length);ctx.clearRect(0,0,w,h);days.forEach((day,i)=>{const value=sum(data.batches.filter(b=>b.date===day),'saleable'),bh=value*(h-55)/max,x=25+i*slot+slot*.2;ctx.fillStyle='#74a58a';ctx.beginPath();ctx.roundRect(x,h-30-bh,slot*.6,bh,5);ctx.fill();ctx.fillStyle='#68776F';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(day.slice(5),x+slot*.3,h-8);ctx.fillText(value+' kg',x+slot*.3,h-35-bh)})}
          return;
        }
        const make=(id,type,labels,datasets,options={})=>{const el=$('#'+id);if(el)chartInstances.push(new Chart(el,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:9,font:{size:10}}}},scales:type==='doughnut'?{}:{y:{beginAtZero:true,title:{display:true,text:'kg'}}},...options}}))};
        make('supply-chart','bar',['Oyster'],[{label:'Saleable supply (kg)',data:[available()],backgroundColor:'#145A48',borderRadius:5},{label:'Active demand (kg)',data:[demand()],backgroundColor:'#d7aa65',borderRadius:5}]);
        make('fulfil-chart','doughnut',['Approved allocation','Remaining demand'],[{data:[allocated(),unmet()],backgroundColor:['#145A48','#d8e4db']}],{cutout:'72%',scales:{}});
        const days=[...new Set(data.batches.map(b=>b.date))].sort();make('harvest-chart','bar',days,[{label:'Saleable (kg)',data:days.map(day=>sum(data.batches.filter(b=>b.date===day),'saleable')),backgroundColor:'#74a58a',borderRadius:5}]);
      }
      function csv(name,rows){if(!rows.length){toast('There are no rows to export.',true);return}const keys=Object.keys(rows[0]);const contents=[keys,...rows.map(row=>keys.map(k=>row[k]??''))].map(row=>row.map(value=>`"${String(value).replace(/"/g,'""')}"`).join(',')).join('\r\n');const blob=new Blob([contents],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV download started.')}
      function fields(spec,obj={}){return `<form id="record-form"><div class="form-grid">${spec.map(([key,label,type,required,options])=>`<label class="field" for="field-${key}">${esc(label)}<${type==='select'?'select':'input'} id="field-${key}" name="${key}" ${type==='select'?'':`type="${type}" value="${esc(obj[key]??'')}"`} ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}>${type==='select'?`<option value="">Select…</option>${options.map(o=>`<option value="${esc(o)}" ${obj[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:''}${type==='select'?'':'</input>'}</label>`).join('')}</div><p id="form-error" class="subtle" role="alert"></p><button type="submit" class="btn btn-primary" style="margin-top:12px">Save record</button></form>`}
      function formAction(kind,id){
        if(!modeGuard())return;
        const collection=kind==='grower'?'growers':kind==='batch'?'batches':kind==='buyer'?'buyers':kind==='order'?'orders':'vehicles';
        const original=data[collection].find(x=>x.id===id)||{};
        const growerOptions=data.growers.map(x=>x.id),buyerOptions=data.buyers.map(x=>x.id);
        const spec={
          grower:[['name','Grower name','text',1],['location','Farm location','text',1],['contact','Contact email','email',1],['status','Status','select',1,['Active','Inactive']]],
          buyer:[['name','Business name','text',1],['location','Location','text',1],['contact','Contact email','email',1],['status','Status','select',1,['Active','Inactive']]],
          batch:[['grower','Grower ID','select',1,growerOptions],['species','Mushroom species','text',1],['expected','Expected quantity (kg)','number',1],['confirmed','Harvested quantity (kg)','number',1],['saleable','Quality-checked saleable (kg)','number',1],['date','Harvest availability date','date',1],['grade','Quality grade','select',1,['A','B','Pending','Rejected']],['notes','Inspection notes','text',0]],
          order:[['buyer','Buyer ID','select',1,buyerOptions],['species','Mushroom species','text',1],['qty','Required quantity (kg)','number',1],['price','Maximum price (₹/kg)','number',1],['quality','Preferred quality','select',1,['A','B','Any']],['date','Delivery date','date',1],['window','Delivery window (HH:MM–HH:MM)','text',1],['destination','Delivery destination','text',1],['priority','Priority','select',1,['Normal','High']],['notes','Notes','text',0]],
          vehicle:[['type','Vehicle type','text',1],['capacity','Capacity (kg)','number',1],['driver','Driver or operator','text',1],['status','Availability','select',1,['Available','Unavailable']]]
        }[kind];
        const title=(id?'Edit ':'Add ')+kind;
        showModal(title,`${id&&['order','batch'].includes(kind)?notice('Changing quantities or dates may affect existing proposals and dispatch plans. Review operational impact after saving.','amber'):''}${fields(spec,original)}`,'',e=>{
          const values=Object.fromEntries(new FormData(e.target));for(const [key,,type] of spec)if(type==='number')values[key]=Number(values[key]);
          const error=$('#form-error');let message='';
          if(kind==='batch'&&(values.confirmed>values.expected||values.saleable>values.confirmed))message='Confirmed quantity cannot exceed expected quantity; saleable quantity cannot exceed confirmed quantity.';
          if(kind==='batch'&&values.grade==='Rejected'&&values.saleable>0)message='A rejected batch cannot contain saleable quantity.';
          if(kind==='order'&&(!values.qty||!values.price))message='Required quantity and maximum price must be greater than zero.';
          if(kind==='order'&&!/^([01]\d|2[0-3]):[0-5]\d[–-]([01]\d|2[0-3]):[0-5]\d$/.test(values.window))message='Enter a delivery window such as 09:00–13:00.';
          if(kind==='order'&&/^([01]\d|2[0-3]):[0-5]\d[–-]([01]\d|2[0-3]):[0-5]\d$/.test(values.window)&&values.window.slice(0,5)>=values.window.slice(6))message='Delivery end time must be later than start time.';
          if(kind==='vehicle'&&values.capacity<=0)message='Vehicle capacity must be greater than zero.';
          if(message){error.textContent=message;return}
          const prefix={grower:'GR',batch:'BAT',buyer:'BUY',order:'ORD',vehicle:'VEH'}[kind];
          const record={...original,...values,id:id||`${prefix}-${String(data[collection].length+1).padStart(3,'0')}`};
          if(kind==='batch'){record.status=record.grade==='Rejected'?'Unavailable':record.saleable>0?'Saleable':'Quality Pending'}
          if(kind==='order')record.status=original.status||'Draft';
          if(id)Object.assign(original,record);else data[collection].push(record);
          closeModal();render();toast(`${kind[0].toUpperCase()+kind.slice(1)} ${id?'updated':'added'} in demo mode.`);
        });
      }
      function detail(kind,id){
        const item=data[kind+'s']?.find(x=>x.id===id)||data.batches.find(x=>x.id===id)||data.orders.find(x=>x.id===id);
        if(!item)return toast('Record not found.',true);
        const related=kind==='grower'?data.batches.filter(b=>b.grower===id):kind==='buyer'?data.orders.filter(o=>o.buyer===id):[];
        showModal(`${kind[0].toUpperCase()+kind.slice(1)} · ${id}`,`<div class="stack">${Object.entries(item).map(([k,v])=>`<div class="notice"><strong>${esc(k.replaceAll('_',' '))}</strong> · ${esc(v)}</div>`).join('')}${related.length?`<h3>Related records</h3>${related.map(x=>`<div class="notice">${esc(x.id)} · ${esc(x.species||'')} · ${kg(x.saleable??x.qty)}</div>`).join('')}`:''}<p class="subtle">Events and accepted commitments require a connected service for authoritative history.</p></div>`,'');
      }
      function confirmation(title,description,onConfirm,label='Confirm'){
        showModal(title,notice(description,'amber'),`<button type="button" class="btn btn-primary" id="confirm-action">${esc(label)}</button>`);
        $('#confirm-action').onclick=()=>{closeModal();onConfirm()}
      }
      function perform(action,id){
        if(action==='open-login'){if(hasSession()){navigate('overview');return}authView='login';render();return}
        if(action==='show-home'){pendingPage='overview';authView='landing';render();return}
        if(action==='demo-signin'){try{sessionStorage.setItem(SESSION_KEY,'demo')}catch{}page=pendingPage;pendingPage='overview';render();toast('Demo workspace opened. Changes are saved locally in this browser.');return}
        if(action==='sign-out'){try{sessionStorage.removeItem(SESSION_KEY)}catch{}authView='login';render();return}
        if(action.startsWith('go-'))return navigate(action.slice(3));
        if(action.startsWith('detail-')){const [kind,key]=action.slice(7).split(':');return detail(kind,key)}
        if(action.startsWith('add-')||action.startsWith('edit-')){const [verb,rest]=action.split('-');const [kind,key]=rest.split(':');return formAction(kind,key)}
        if(action==='walk-prev'||action==='walk-next'){walk=action==='walk-prev'?Math.max(0,walk-1):(walk+1)%13;navigate(steps[walk][1]);return}
        if(action==='walk-open')return navigate(steps[walk][1]);
        if(action==='page-prev'||action==='page-next'){pageNumber+=action==='page-next'?1:-1;render();return}
        if(action==='mode-api'){toast('Connected mode is unavailable until a FungiSync backend and API contract are supplied.',true);return}
        if(action==='mode-demo'){mode='demo';data=seed();walk=0;render();toast('Reproducible demonstration scenario restored.');return}
        if(action==='retry-api')return api.request('health','check').catch(e=>toast(e.message,true));
        if(action==='export-json'){const blob=new Blob([JSON.stringify({format:'fungisync-backup-v1',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fungisync-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSON backup downloaded.');return}
        if(action==='reset-data')return confirmation('Reset local data','This replaces the saved records in this browser with the original FungiSync starter scenario.',()=>{data=seed();localStorage.removeItem(STORAGE_KEY);page='overview';render();toast('Starter data restored.')},'Reset local data');
        if(action.startsWith('export-')){if(!modeGuard())return;const kind=action.slice(7);return csv('fungisync-'+kind,kind==='report'?[{saleable_kg:available(),active_demand_kg:demand(),approved_allocation_kg:allocated(),unallocated_kg:unallocated(),unmet_demand_kg:unmet()}]:data[kind]||[])}
        if(!modeGuard())return;
        if(action==='generate-matches'){data.matching=true;render();toast('Illustrative species-compatible matches generated. Other constraints require verification.');return}
        if(action==='generate-proposal'){
          if(!data.matching)return toast('Generate matching results first.',true);
          if(data.proposal)return toast('Initial proposal already exists. Existing approved commitments were not overwritten.',true);
          data.proposal={id:'ALC-001',rows:initialRows(),status:'Proposed',generated:new Date().toLocaleString()};render();toast('Illustrative allocation proposal generated; no commitment was changed.');return
        }
        if(action==='validate-proposal'){const p=data.revision||data.proposal;if(!p)return;const issues=allocationIssues(p);return toast(issues.length?`Validation failed: ${issues.slice(0,2).join(' ')}`:'Batch, order, quality, eligibility, date and quantity checks passed. Commercial terms and routing still require service verification.',!!issues.length)}
        if(action==='approve-proposal'||action==='approve-revision'){const p=action==='approve-revision'?data.revision:data.revision||data.proposal;if(!p)return;const issues=allocationIssues(p);if(issues.length)return toast(`Resolve local validation issues before approval: ${issues[0]}`,true);return confirmation('Approve illustrative proposal',`This approves ${p.id} for coordinator review state only. It does not record buyer acceptance or confirm a commercial order. Review dispatch separately.`,()=>{p.status='Approved';render();toast('Coordinator approval recorded in demo mode; buyer acceptance is not recorded.')},'Approve proposal')}
        if(action==='reject-proposal'||action==='reject-revision'){const p=action==='reject-revision'?data.revision:data.revision||data.proposal;if(!p)return;return confirmation('Reject proposal',`Reject ${p.id}? Existing approved commitments remain in history.`,()=>{p.status='Rejected';render();toast('Proposal rejected in demo mode.')},'Reject proposal')}
        if(action==='request-revision')return toast('Use Dynamic Replanning to analyse an exception and generate a separate revision.');
        if(action==='audit-proposal'||action==='history-events')return showModal('Event and proposal history',`<div class="stack">${data.events.slice().reverse().map(eventRow).join('')}${[data.proposal,data.revision].filter(Boolean).map(p=>`<div class="notice">${esc(p.id)} · ${esc(p.status)} · ${esc(p.generated)}</div>`).join('')}</div>`,'');
        if(action.startsWith('cancel-order:')){const o=data.orders.find(x=>x.id===action.split(':')[1]);if(!o)return;return confirmation('Cancel buyer order',`Cancel ${o.id} (${kg(o.qty)})? Existing allocation and dispatch proposals may be affected. This creates an exception for human review; no approved commitment is silently revised.`,()=>{o.status='Cancelled';const affected=(data.proposal?.rows||[]).filter(r=>r.order===o.id).map(r=>r.batch);data.dispatch=false;data.dispatchPlan=null;data.exception={id:'EVT-'+String(data.events.length+1).padStart(3,'0'),type:'Buyer order cancelled',severity:'Critical',reference:[o.id,...new Set(affected)].join(' · '),impact:`${kg(o.qty)} requested quantity removed from active demand`,status:'Open',time:new Date().toLocaleString()};data.events.push(data.exception);data.analysed=false;data.revision=null;render();toast('Order cancelled in demo mode. Review the resulting exception.')},'Cancel order')}
        if(action.startsWith('deactivate-grower:')){let g=data.growers.find(x=>x.id===action.split(':')[1]);return confirmation('Deactivate grower',`Deactivate ${g.name}? Existing batches and operational plans must be reviewed separately.`,()=>{g.status='Inactive';render();toast('Grower deactivated in demo mode.')},'Deactivate')}
        if(action.startsWith('toggle-vehicle:')){let v=data.vehicles.find(x=>x.id===action.split(':')[1]);return confirmation('Change vehicle availability',`Mark ${v.id} ${v.status==='Available'?'unavailable':'available'}? Check any dispatch assignments afterward.`,()=>{v.status=v.status==='Available'?'Unavailable':'Available';render();toast('Vehicle availability changed in demo mode.')},'Update vehicle')}
        if(action==='plan-dispatch'){const proposal=data.revision?.status==='Approved'?data.revision:data.proposal;if(!proposal||proposal.status!=='Approved')return toast('Approve an allocation before creating a dispatch proposal.',true);const error=makeDispatchPlan(proposal);if(error)return toast(error,true);render();toast('Dispatch stop proposal created from approved allocations. No trip was started.');return}
        if(action==='discard-dispatch')return confirmation('Discard dispatch proposal','Remove the proposed stop sequence? This does not change approved allocations.',()=>{data.dispatch=false;data.dispatchPlan=null;render();toast('Dispatch proposal discarded.')},'Discard proposal')
        if(action==='dispatch-timeline'){const p=data.dispatchPlan;if(!p)return toast('No dispatch proposal is available.',true);return showModal('Dispatch proposal details',`<div class="stack">${notice(`${esc(p.id)} · ${esc(p.status)} · created ${esc(p.created)}`)}${notice(`Allocation: ${esc(p.allocation||'not linked')} · assigned vehicle: ${esc(p.vehicle)}`)}${notice('This stop sequence has not been executed. Live pickup, delivery, GPS and route status are unavailable.')}</div>`, '')}
        if(action==='analyse-impact'){if(!data.exception)return toast('Record an exception first.',true);data.analysed=true;render();toast('Demonstration impact analysed; no production records changed.');return}
        if(action==='generate-revision'){if(!data.analysed)return toast('Analyse impact first.',true);if(data.revision)return toast('The existing revised proposal was not overwritten.',true);data.revision={id:'ALC-002',rows:initialRows(),status:'Proposed',generated:new Date().toLocaleString()};render();toast('A separate illustrative revised proposal was generated.');return}
        if(action==='view-alternatives'){data.alternatives=true;render();return}
        if(action==='compare-plans'){if(!data.revision)return;const before=data.proposal,oldQty=sum(before?.rows||[],'qty'),newQty=sum(data.revision.rows,'qty');return showModal('Before and after · allocation',`<div class="comparison"><div><h3>Previous proposal</h3><p>${kg(oldQty)} across ${(new Set((before?.rows||[]).map(r=>r.order))).size} orders.</p>${allocationTable(before||{status:'Unavailable',rows:[]})}</div><div><h3>Revised proposal</h3><p>${kg(newQty)} across ${(new Set(data.revision.rows.map(r=>r.order))).size} orders.</p>${allocationTable(data.revision)}</div></div><p class="subtle">Quantity change: ${kg(Math.abs(oldQty-newQty))} ${newQty<oldQty?'fewer':'more'} allocated. Buyer acceptance and revised dispatch remain separate.</p>`, '')}
        if(action==='submit-revision')return toast('Revised proposal is awaiting coordinator approval; buyer acceptance remains separate.');
        if(action==='revised-dispatch'){if(!data.revision)return toast('Generate an allocation revision first.',true);const issues=allocationIssues(data.revision);if(issues.length)return toast(`Resolve allocation issues first: ${issues[0]}`,true);return confirmation('Prepare revised dispatch stops','Create a separate capacity-checked stop proposal from the revised allocation. It will not execute the trip or change buyer commitments.',()=>{const error=makeDispatchPlan(data.revision);if(error)return toast(error,true);render();toast('Revised dispatch proposal created for review.')},'Prepare stops')}
        if(action==='event'){const event=data.events.find(x=>x.id===id);return showModal(`Event ${id}`,`<div class="stack"><div class="notice">${esc(event.type)} · ${esc(event.time)}</div><div class="notice">${esc(event.reference)}</div><div class="notice">${esc(event.impact)}</div><div>${badge(event.status)}</div></div>`,btn('Open replanning','modal-replanning'))}
        if(action==='modal-replanning'){closeModal();navigate('replanning');return}
        if(action==='notifications')return showModal('Notification centre',`<div class="stack">${data.exception?eventRow(data.exception):notice('No urgent notifications.')}${data.proposal?.status==='Proposed'?notice('An allocation proposal is awaiting coordinator review.','amber'):''}</div>`,'');
      }
      document.addEventListener('keydown',e=>{const target=e.target.closest?.('[data-page][role=link]');if(target&&(e.key==='Enter'||e.key===' ')){e.preventDefault();navigate(target.dataset.page)}});
      document.addEventListener('click',e=>{
        const target=e.target.closest('[data-action],[data-page],[data-sort]');if(!target)return;
        if(target.dataset.page){navigate(target.dataset.page);return}
        if(target.dataset.sort){if(sortKey===target.dataset.sort)sortDirection*=-1;else{sortKey=target.dataset.sort;sortDirection=1}render();return}
        perform(target.dataset.action,target.dataset.id);
      });
      $('#notifications').onclick=()=>perform('notifications');
      $('#language-select').onchange=e=>{language=e.target.value;try{localStorage.setItem('fungisync-language',language)}catch{}render()};
      $('#role-select').onchange=()=>{render();toast('Demo role view changed. This local prototype does not provide account authentication or enforce server permissions.')};
      $('#global-search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q){filter='';if(page==='growers'||page==='buyers'){render()}return}let found=data.growers.some(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q)))?'growers':data.buyers.concat(data.orders).some(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q)))?'buyers':data.events.some(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q)))?'replanning':null;if(found&&page!==found){page=found;render()}filter=q;pageNumber=1;if(page==='growers'||page==='buyers'){const input=$('#list-search');if(input){input.value=q;const start=input.selectionStart;render();$('#list-search')?.focus();$('#list-search')?.setSelectionRange(start,start)}}});
      document.addEventListener('submit',e=>{if(e.target?.id!=='login-form')return;e.preventDefault();const password=$('#login-password');if(password)password.value='';const message=$('#auth-message');if(message)message.textContent='Sign-in service is not configured. Use demo mode or connect a FungiSync authentication backend.'});
      $('#app').addEventListener('input',e=>{if(e.target.id==='list-search'){filter=e.target.value;pageNumber=1;const caret=e.target.selectionStart;render();$('#list-search')?.focus();$('#list-search')?.setSelectionRange(caret,caret)}});
      $('#app').addEventListener('change',e=>{if(e.target.id==='status-filter'){statusFilter=e.target.value;pageNumber=1;render();return}if(e.target.id==='import-json'&&e.target.files?.[0]){const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result),candidate=parsed.data||parsed;if(!Array.isArray(candidate.growers)||!Array.isArray(candidate.batches)||!Array.isArray(candidate.buyers)||!Array.isArray(candidate.orders)||!Array.isArray(candidate.vehicles)||!Array.isArray(candidate.events))throw new Error('This file is not a valid FungiSync backup.');data=candidate;mode='demo';page='overview';render();toast('Backup restored to this browser.')}catch(error){toast(error.message||'Could not read this backup.',true)}e.target.value=''};reader.readAsText(e.target.files[0])}});
      bindAmbientMotion();updateMotion();render();
      window.addEventListener?.('load',()=>{if(window.lucide)lucide.createIcons();if(window.Chart&&page==='overview'&&hasSession()&&mode==='demo'){chartInstances.forEach(chart=>chart.destroy());chartInstances=[];drawCharts()}});
    })();
  </script>
